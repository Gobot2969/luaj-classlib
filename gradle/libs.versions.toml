[versions]
luaj = "3.0.2-2"
junit = "6.1.3"
bcel = "5.2"

[libraries]
luaj = { module = "com.github.dimmskii:luaj-jitpack", version.ref = "luaj" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# LuaJC (Lua compiled to Java bytecode) needs it; the tests run scripts both interpreted and compiled
bcel = { module = "org.apache.bcel:bcel", version.ref = "bcel" }
